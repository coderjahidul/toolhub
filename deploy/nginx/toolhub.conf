# Public site. Replace toolhub.example.com and confirm the PHP-FPM socket.
server {
    listen 80;
    listen [::]:80;
    server_name toolhub.example.com;

    client_max_body_size 55m;

    location /api/ {
        include fastcgi_params;
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
        fastcgi_param SCRIPT_FILENAME /var/www/html/toolhub/backend/public/index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/html/toolhub/backend/public;
        fastcgi_param HTTP_X_FORWARDED_FOR $remote_addr;
        fastcgi_param HTTP_X_FORWARDED_PROTO $scheme;
        fastcgi_read_timeout 60s;
    }

    location /up {
        include fastcgi_params;
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
        fastcgi_param SCRIPT_FILENAME /var/www/html/toolhub/backend/public/index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/html/toolhub/backend/public;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
